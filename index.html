/* ============================================================
 * 以下为渲染逻辑，一般无需修改
 * ============================================================ */
const $ = (sel, el = document) => el.querySelector(sel);

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

/* 渲染说明区 */
function renderIntro(){
  const box = $("#intro-body");
  const paras = (SITE_CONFIG.intro || [])
    .map(t => `<p>${escapeHtml(t)}</p>`).join("");
  box.innerHTML = paras ||
    `<p class="intro-placeholder">（说明文字预留区域：请在 SITE_CONFIG.intro 中补充）</p>`;
}

/* 把 file（旧：单个文件）和 files（新：多个文件）统一成附件列表 */
function noteFiles(n){
  if (Array.isArray(n.files) && n.files.length) return n.files;
  return n.file ? [{ name: "阅读 PDF", path: n.file }] : [];
}

/* 渲染笔记列表 */
function renderNotes(){
  const list = $("#note-list");
  const notes = SITE_CONFIG.notes || [];
  if (!notes.length){
    list.innerHTML = `<div class="note-empty">暂无笔记 —— 在 SITE_CONFIG.notes 中添加条目后即可显示。</div>`;
    return;
  }
  list.innerHTML = notes.map((n, i) => {
    const idx   = String(i + 1).padStart(2, "0");
    const meta  = [n.date, ...(n.tags || [])].filter(Boolean).map(escapeHtml).join(" · ");
    const files = noteFiles(n);
    /* 只有一个附件时标题可点击；多个附件时标题为纯文本，附件在下方逐条列出 */
    const titleHtml = files.length === 1
      ? `<a href="${encodeURI(files[0].path || "#")}" target="_blank" rel="noopener">${escapeHtml(n.title || "未命名笔记")}</a>`
      : escapeHtml(n.title || "未命名笔记");
    /* 每个附件独占一行；dl: true 时点击直接下载（箭头用 ↓，否则 ↗ 新标签页打开） */
    const links = files.length
      ? `<div class="note-files">${files.map(f =>
          `<a class="note-cta" href="${encodeURI(f.path || "#")}" target="_blank" rel="noopener"${f.dl ? " download" : ""}>${escapeHtml(f.name || "下载文件")}${f.dl ? " ↓" : " ↗"}</a>`
        ).join("")}</div>`
      : `<span class="note-nofile">暂无附件</span>`;
    return `
      <article class="note-card">
        <div class="note-index">${idx}</div>
        <div class="note-body">
          <h3 class="note-title">${titleHtml}</h3>
          <div class="note-meta">${meta}</div>
          <p class="note-desc">${escapeHtml(n.desc || "")}</p>
          ${links}
        </div>
      </article>`;
  }).join("");
}

/* 渲染友情链接 */
function renderLinks(){
  const ul = $("#link-list");
  const links = SITE_CONFIG.links || [];
  ul.innerHTML = links.map(l => `
    <li>
      <a href="${escapeHtml(l.url || "#")}" target="_blank" rel="noopener">
        <span class="link-name">${escapeHtml(l.name || "未命名链接")}</span>
        ${l.desc ? `<span class="link-desc">${escapeHtml(l.desc)}</span>` : ""}
      </a>
    </li>`).join("");
}
